<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description"
        content="Product review form created for WDD131 assignment allowing users to submit product ratings, installation dates, and written feedback.">

    <meta name="author" content="João Victor">

    <link rel="stylesheet" href="styles/stylesform.css">
    <script src="scripts/scriptsform.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <fieldset>
                <legend>Review Details</legend>

                <!-- PRODUCT -->
                <label for="productName">
                    Product Name <span class="required">*</span>
                </label>

                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <!-- RATING -->
                <p>Overall Rating <span class="required">*</span></p>

                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">1</label>

                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating2">2</label>

                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating3">3</label>

                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating4">4</label>

                <input type="radio" id="rating5" name="rating" value="5" required>
                <label for="rating5">5</label>

                <!-- DATE -->
                <label for="installDate">
                    Date of Installation <span class="required">*</span>
                </label>
                <input type="date" id="installDate" name="installDate" required>

                <!-- FEATURES -->
                <p>Which features did you find useful? (Optional)</p>

                <input type="checkbox" id="durability" name="features" value="durability">
                <label for="durability">Durability</label>

                <input type="checkbox" id="ease" name="features" value="ease-of-use">
                <label for="ease">Ease of Use</label>

                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance">Performance</label>

                <input type="checkbox" id="design" name="features" value="design">
                <label for="design">Design</label>

                <!-- REVIEW -->
                <label for="comments">Written Review (Optional)</label>
                <textarea id="comments" name="comments"></textarea>

                <!-- NAME -->
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">

            </fieldset>

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> | Product Review | João Victor</p>
    </footer>

</body>

</html>
