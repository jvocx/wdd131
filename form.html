<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="WDD131 - Week 05 Assignment: Product Review Form for tracking customer feedback.">
    <meta name="author" content="João Victor">
    <link rel="stylesheet" href="styles/stylesform.css">
    <script src="scripts/scriptsform.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">
            <fieldset>
                <legend>Review Details</legend>

                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <label>Overall Rating <span class="required">*</span></label>
                <div class="rating-container">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <label for="rating1">1</label>

                    <input type="radio" id="rating2" name="rating" value="2" required>
                    <label for="rating2">2</label>

                    <input type="radio" id="rating3" name="rating" value="3" required>
                    <label for="rating3">3</label>

                    <input type="radio" id="rating4" name="rating" value="4" required>
                    <label for="rating4">4</label>

                    <input type="radio" id="rating5" name="rating" value="5" required>
                    <label for="rating5">5</label>
                </div>

                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>

                <label>Which features did you find useful? (Optional)</label>
                <div class="checkbox-container">
                    <input type="checkbox" id="feature1" name="features" value="durability">
                    <label for="feature1">Durability</label>

                    <input type="checkbox" id="feature2" name="features" value="ease-of-use">
                    <label for="feature2">Ease of Use</label>

                    <input type="checkbox" id="feature3" name="features" value="performance">
                    <label for="feature3">Performance</label>

                    <input type="checkbox" id="feature4" name="features" value="design">
                    <label for="feature4">Design</label>
                </div>

                <label for="comments">Written Review (Optional)</label>
                <textarea id="comments" name="comments" rows="4"></textarea>

                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </fieldset>

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentYear"></span> | Product Review | João Victor</p>
    </footer>
</body>

</html>
